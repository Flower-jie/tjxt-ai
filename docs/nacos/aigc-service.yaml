tj:
  ai:
    dashscope:
      key: ${ALIYUN_API_KEY:sk-改成你的百炼APIKey}  # 二选一：IDEA启动配置里加环境变量 ALIYUN_API_KEY，或直接把这行改成你的 key
    chat-provider: DASHSCOPE   # DASHSCOPE=百炼原生协议（课程默认）/ OPENAI=OpenAI兼容网关
    rag:
      enabled: true            # 是否启用向量检索(RAG)，需要 embedding 模型（百炼 text-embedding-v3）
    session:
      title: Hello，我是天机AI助理
      describe: 我是由天机学堂倾力打造的智能助理，我不仅能推荐课程、答疑解惑，还能为您激发创意、畅聊心事。
      examples:
        - title: "课程推荐"
          describe: "能帮我推荐一个合适的课吗？"
        - title: "课程推荐"
          describe: "最近有什么新课吗？"
        - title: "课程推荐"
          describe: "如何选择适合我的课程？"
        - title: "课程推荐"
          describe: "有哪些热门课程推荐？"
        - title: "课程购买"
          describe: "我想要购买《Java进阶编程实战》"
        - title: "课程购买"
          describe: "我想要报名《Java高级架构与微服务》"
        - title: "课程购买"
          describe: "《Java进阶编程实战》的课程价格是多少？"
        - title: "课程购买"
          describe: "《Java高级架构与微服务》的课程价格是多少？"
        - title: "课程介绍"
          describe: "请帮我介绍一下《互联网产品运营实战》"
        - title: "课程介绍"
          describe: "《Java大数据处理与分析》这门课一共有多少节？"
        - title: "课程介绍"
          describe: "《Java高级架构与微服务》能学到什么内容？"
        - title: "课程介绍"
          describe: "《互联网产品运营实战》适合我学习吗？"
        - title: "知识讲解"
          describe: "面向对象的三大特征是什么？"
        - title: "知识讲解"
          describe: "ArrayList和LinkedList有何区别？"
        - title: "知识讲解"
          describe: "Java多线程怎么实现？"
        - title: "知识讲解"
          describe: "Spring Boot和SSM有什么区别？"
        - title: "知识讲解"
          describe: "列表和元组有什么区别？"
        - title: "知识讲解"
          describe: " Python如何管理内存？"
        - title: "知识讲解"
          describe: " 装饰器的作用是什么？"
        - title: "知识讲解"
          describe: "多线程为什么有GIL限制？"      
spring:
  elasticsearch:
    uris: http://192.168.150.101:19200
  ai:
    dashscope:
      api-key: ${tj.ai.dashscope.key}
      chat:
        enabled: true
        options:
          model: qwen-max
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
          dimensions: 1024
    openai:
      # 你的代码里 OpenAI 的音频/文本模型是启动必需的，这里复用百炼的 OpenAI 兼容接口，填同一个 key 即可
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${tj.ai.dashscope.key}
      chat:
        options:
          model: qwen-max
    vectorstore:
      elasticsearch:
        initialize-schema: true
        dimensions: 1024
